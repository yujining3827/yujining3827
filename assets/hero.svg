<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="정유진 프로필을 JSON 응답으로 표현한 터미널">
  <title>curl -i localhost:8080/api/v1/me → 200 OK</title>
  <style>
    .screen { font: 14px ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, 'Apple SD Gothic Neo', 'Malgun Gothic', monospace; fill: #e2e2e6; }
    .title { font: 12px ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; fill: #7c7c86; }
    .user, .status, .string { fill: #8ae234; }
    .cwd, .key { fill: #6cb6ff; }
    .header { fill: #56d4dd; }
    .line { opacity: 0; animation: print 0.01s linear forwards; }
    .caret { fill: #b3a1ff; animation: blink 1.1s steps(1) infinite; }
    @keyframes print { to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .line { opacity: 1; animation: none; }
      .caret { animation: none; }
    }
  </style>

  <rect x="0.5" y="0.5" width="679" height="399" rx="12" fill="#0d0d10" stroke="#26262c"/>
  <path d="M0.5 38V12.5a12 12 0 0 1 12-12h655a12 12 0 0 1 12 12V38z" fill="#2a2a2e"/>
  <circle cx="22" cy="19" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="19" r="6" fill="#febc2e"/>
  <circle cx="62" cy="19" r="6" fill="#28c840"/>
  <text class="title" x="340" y="23" text-anchor="middle">yujin — -zsh — 80×24</text>

