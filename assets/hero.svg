    <text class="line" x="41" y="254" style="animation-delay:1.6s"><tspan class="key">"stack"</tspan>: [<tspan class="string">"Java"</tspan>, <tspan class="string">"Spring Boot"</tspan>, <tspan class="string">"JPA"</tspan>, <tspan class="string">"MySQL"</tspan>],</text>
